      return vitodens::bus().value(381, vitodens::bus().v.pump_target);

  - platform: template
    name: "Heizkreispumpe Ist"
    id: s_pumpe_ist
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(381, vitodens::bus().v.pump_actual);

  # --- Heizkurve (DID 880) ---
  - platform: template
    name: "Heizkurve Niveau"
    id: s_heizkurve_niveau
    unit_of_measurement: ""
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(880, vitodens::bus().v.curve_level);

  - platform: template
    name: "Heizkurve Fußpunkt"
    id: s_heizkurve_fusspunkt
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(880, vitodens::bus().v.curve_basepoint);

  # --- Diagnose ---
  - platform: template
    name: "Fehleranzahl"
    id: s_fehleranzahl
    unit_of_measurement: ""
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(265, (float) vitodens::bus().v.error_count);

  - platform: template
    name: "Gateway WLAN-Signal"
    id: s_gateway_signal
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(900, vitodens::bus().v.gateway_rssi);

