# ============================================================================
#  Viessmann Vitodens über E3-CAN – ESP32-C3 SuperMini + SN65HVD230
#
#  Verdrahtung (SN65HVD230):
#    VCC  -> 3V3     (niemals 5 V)
#    GND  -> GND     (gemeinsame Masse mit dem CAN-Bus!)
#    CTX  -> GPIO4
#    CRX  -> GPIO5
#    Rs   -> GND     (High-Speed-Modus)
#    CANH -> E3-Bus CANH (gelbe Buchse)
#    CANL -> E3-Bus CANL
#  120 Ohm nur bestuecken, wenn der Adapter am Busende sitzt.
#
#  Bus: 250 kBit/s, UDS/ISO-TP, Ziel-ECU 0x680, Antworten 0x690.
#  Datenpunkte: siehe "open3e esp32/dids-heizung.md" (22 DIDs, ohne Warmwasser).
#
#  Wichtig: Es darf immer nur EIN Teilnehmer aktiv Anfragen stellen.
#  Vor dem ersten Start also open3e (Unraid/PC) stoppen.
# ============================================================================

substitutions:
  devicename: vitodens-can
  friendly_name: Vitodens CAN
  can_tx_pin: "4"
  can_rx_pin: "5"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: "Vitodens E3-CAN (UDS/ISO-TP), 22 Datenpunkte"
  includes:
    - vitodens-uds.h
  on_boot:
    # Bewusst spaet: erst WLAN/API starten, dann den CAN-Bus initialisieren.
    # So bleibt das Geraet auch dann erreichbar, wenn die Bus-Initialisierung
    # haengt oder fehlschlaegt.
    priority: -100
    then:
      - lambda: |-
          vitodens::bus().begin(${can_tx_pin}, ${can_rx_pin});

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
    # ESPHome schliesst den TWAI-Treiber standardmaessig aus (nur esp32_can
    # zieht ihn). Wir nutzen den Treiber direkt im Header -> wieder aktivieren.
    #   "driver"        -> Legacy-Shim mit driver/twai.h
    #   "esp_driver_twai" -> eigentliche TWAI-Implementierung (IDF 5.5)
    advanced:
      include_builtin_idf_components:
        - driver
        - esp_driver_twai

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "Vitodens-CAN"
    password: "vitodens-can-2026"

captive_portal:

# Ein Schritt pro Tick; die Klasse arbeitet nicht blockierend.
interval:
  - interval: 20ms
    then:
      - lambda: 'vitodens::bus().loop();'

# ---------------------------------------------------------------- Freigaben
switch:
  - platform: template
    name: "Schreiben freigeben"
    id: sw_write_enable
    optimistic: true
    # Nach jedem Neustart wieder aus - Schreibzugriffe muessen bewusst
    # freigegeben werden.
    restore_mode: ALWAYS_OFF
    icon: mdi:lock-open-variant
    entity_category: config

# ---------------------------------------------------------------- Aktionen
button:
  - platform: template
    name: "CAN Bus neu starten"
    id: btn_can_restart
    entity_category: diagnostic
    icon: mdi:restart
    on_press:
      - lambda: 'vitodens::bus().recover();'

  - platform: template
    name: "Bus-Scan starten"
    id: btn_bus_scan
    entity_category: diagnostic
    icon: mdi:radar
    on_press:
      - lambda: 'vitodens::bus().start_scan();'

# ---------------------------------------------------------------- Sensoren
sensor:
