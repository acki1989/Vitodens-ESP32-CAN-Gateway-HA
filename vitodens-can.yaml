  - platform: template
    name: "Vorlauftemperatur"
    id: s_vorlauf
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(268, vitodens::bus().v.flow_temp);

  - platform: template
    name: "Vorlauftemperatur Soll"
    id: s_vorlauf_soll
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(527, vitodens::bus().v.flow_setpoint);

  - platform: template
    name: "Außentemperatur"
    id: s_aussentemp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(274, vitodens::bus().v.out_temp);

  - platform: template
    name: "Abgastemperatur"
    id: s_abgas
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(331, vitodens::bus().v.flue_temp);

  - platform: template
    name: "Wasserdruck"
