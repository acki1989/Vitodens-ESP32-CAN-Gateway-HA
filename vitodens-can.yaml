    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(318, vitodens::bus().v.pressure);

  # --- Betriebsstatistik (DID 1346) ---
