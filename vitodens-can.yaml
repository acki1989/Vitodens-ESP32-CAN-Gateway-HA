    name: "Betriebsstunden"
    id: s_betriebsstunden
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1346, vitodens::bus().v.op_hours);

  - platform: template
    name: "Brennerstunden"
    id: s_brennerstunden
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1346, vitodens::bus().v.burner_hours);

  - platform: template
    name: "Brennerstarts"
    id: s_brennerstarts
    unit_of_measurement: ""
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1346, vitodens::bus().v.burner_starts);

  # --- Energieverbrauch Heizung (DID 548) ---
  - platform: template
    name: "Energieverbrauch Heizung heute"
    id: s_energie_heute
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(548, vitodens::bus().v.energy_today);

  - platform: template
    name: "Energieverbrauch Heizung 7 Tage"
    id: s_energie_7d
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(548, vitodens::bus().v.energy_7d);

  - platform: template
    name: "Energieverbrauch Heizung Monat"
    id: s_energie_monat
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(548, vitodens::bus().v.energy_month);

  - platform: template
    name: "Energieverbrauch Heizung Jahr"
    id: s_energie_jahr
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(548, vitodens::bus().v.energy_year);

  # --- Gasverbrauch Heizung (DID 544) ---
  - platform: template
    name: "Gasverbrauch Heizung heute"
    id: s_gas_heute
    unit_of_measurement: "m³"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(544, vitodens::bus().v.gas_today);

  - platform: template
    name: "Gasverbrauch Heizung 7 Tage"
    id: s_gas_7d
    unit_of_measurement: "m³"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(544, vitodens::bus().v.gas_7d);

  - platform: template
    name: "Gasverbrauch Heizung Monat"
    id: s_gas_monat
    unit_of_measurement: "m³"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(544, vitodens::bus().v.gas_month);

  - platform: template
    name: "Gasverbrauch Heizung Jahr"
    id: s_gas_jahr
    unit_of_measurement: "m³"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(544, vitodens::bus().v.gas_year);

  # --- Wärmeerzeugung Heizung (DID 1211) ---
  - platform: template
    name: "Wärmemenge Heizung heute"
    id: s_waerme_heute
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1211, vitodens::bus().v.heat_today);

  - platform: template
    name: "Wärmemenge Heizung 7 Tage"
    id: s_waerme_7d
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1211, vitodens::bus().v.heat_7d);

  - platform: template
    name: "Wärmemenge Heizung Monat"
    id: s_waerme_monat
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1211, vitodens::bus().v.heat_month);

  - platform: template
    name: "Wärmemenge Heizung Jahr"
    id: s_waerme_jahr
    unit_of_measurement: "kWh"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return vitodens::bus().value(1211, vitodens::bus().v.heat_year);

  # --- Brenner / Pumpe (DID 364, 381) ---
