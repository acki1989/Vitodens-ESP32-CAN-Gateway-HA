# ---------------------------------------------------------------- Textsensoren
text_sensor:
  - platform: template
    name: "Sensorstatus Vorlauf"
    id: t_vorlauf_status
    entity_category: diagnostic
    icon: mdi:check-circle-outline
    update_interval: 30s
    lambda: |-
      return vitodens::bus().text(268, vitodens::bus().v.flow_state);

  - platform: template
    name: "Sensorstatus Außentemperatur"
    id: t_aussen_status
    entity_category: diagnostic
    icon: mdi:check-circle-outline
    update_interval: 30s
    lambda: |-
      return vitodens::bus().text(274, vitodens::bus().v.out_state);

  - platform: template
    name: "Sensorstatus Abgas"
    id: t_abgas_status
    entity_category: diagnostic
    icon: mdi:check-circle-outline
    update_interval: 30s
    lambda: |-
      return vitodens::bus().text(331, vitodens::bus().v.flue_state);

  - platform: template
    name: "Sensorstatus Wasserdruck"
    id: t_druck_status
    entity_category: diagnostic
    icon: mdi:check-circle-outline
    update_interval: 30s
    lambda: |-
      return vitodens::bus().text(318, vitodens::bus().v.press_state);

  - platform: template
    name: "Gastyp"
    id: t_gastyp
    entity_category: diagnostic
    icon: mdi:fire
    update_interval: 60s
    lambda: |-
      return vitodens::bus().text(929, vitodens::bus().v.gas_type);

  - platform: template
    name: "Nächster Servicetermin"
    id: t_servicetermin
    entity_category: diagnostic
    icon: mdi:calendar-check
    update_interval: 60s
    lambda: |-
      return vitodens::bus().text(522, vitodens::bus().v.service_date);

  - platform: template
    name: "Fehlerliste"
    id: t_fehlerliste
    entity_category: diagnostic
    icon: mdi:alert-circle-outline
    update_interval: 60s
    lambda: |-
      return vitodens::bus().text(265, vitodens::bus().v.error_ids);

  - platform: template
    name: "Gateway MAC"
    id: t_gateway_mac
    entity_category: diagnostic
    icon: mdi:ethernet
    update_interval: 60s
    lambda: |-
      return vitodens::bus().text(593, vitodens::bus().v.gateway_mac);

  - platform: template
    name: "Gateway WLAN-IP"
    id: t_gateway_ip
    entity_category: diagnostic
    icon: mdi:ip-network
    update_interval: 60s
    lambda: |-
      return vitodens::bus().text(607, vitodens::bus().v.gateway_ip);

  - platform: template
    name: "Gateway Netzwerkstatus"
    id: t_gateway_netz
    entity_category: diagnostic
    icon: mdi:access-point-network
    update_interval: 60s
    lambda: |-
      return vitodens::bus().text(602, vitodens::bus().v.gateway_net_state);

  - platform: template
    name: "CAN Bus Status"
    id: t_can_status
    entity_category: diagnostic
    icon: mdi:lan-connect
    update_interval: 30s
    lambda: 'return std::string(vitodens::bus().bus_state());'

  - platform: template
    name: "CAN letzter Fehler"
    id: t_can_fehler
    entity_category: diagnostic
    icon: mdi:alert-outline
    update_interval: 30s
    lambda: |-
      const std::string &e = vitodens::bus().last_error();
      if (e.empty()) return std::string("-");
      return e;

  - platform: template
    name: "Bus-IDs (Diagnose)"
    id: t_bus_ids
    entity_category: diagnostic
    icon: mdi:format-list-bulleted
    update_interval: 10s
    lambda: |-
      const std::string &s = vitodens::bus().bus_ids();
      if (s.empty()) return std::string("-");
      return s;

  - platform: template
    name: "Schreibstatus"
    id: t_write_status
    entity_category: diagnostic
    icon: mdi:pencil-check
    update_interval: 10s
    lambda: |-
      return vitodens::bus().write_status();

# ---------------------------------------------------------------- Binärsensoren
binary_sensor:
  - platform: template
    name: "Brennerflamme"
    id: b_flamme
    device_class: power
    icon: mdi:fire
    lambda: |-
      return vitodens::bus().flag(364, vitodens::bus().v.flame);

  - platform: template
    name: "Heizkreispumpe"
    id: b_pumpe
    device_class: power
    icon: mdi:water-sync
    lambda: |-
      return vitodens::bus().flag(381, vitodens::bus().v.pump_on);

  - platform: template
    name: "Wartung erforderlich"
    id: b_wartung
    entity_category: diagnostic
    device_class: problem
    icon: mdi:wrench
    lambda: |-
      return vitodens::bus().flag(901, vitodens::bus().v.service_required);

  - platform: template
    name: "Störung vorhanden"
    id: b_stoerung
    entity_category: diagnostic
    device_class: problem
    icon: mdi:alert
    lambda: |-
      return vitodens::bus().flag(902, vitodens::bus().v.malfunction != 0);

  - platform: template
    name: "Backend verbunden"
    id: b_backend
    entity_category: diagnostic
    device_class: connectivity
    icon: mdi:cloud-check
    lambda: |-
      return vitodens::bus().flag(1165, vitodens::bus().v.backend_connected);

  - platform: template
    name: "CAN Daten aktuell"
    id: b_can_fresh
    entity_category: diagnostic
    device_class: connectivity
    icon: mdi:lan-check
    lambda: |-
      return vitodens::bus().fresh_any();

# ---------------------------------------------------------------- Stellwert
number:
  - platform: template
    name: "Heizkurve 1 Steigung"
    id: n_heizkurve
    min_value: 0.2
    max_value: 3.5
    step: 0.1
    mode: box
    optimistic: false
    icon: mdi:slope-uphill
    update_interval: 15s
    lambda: |-
      return vitodens::bus().value(880, vitodens::bus().v.curve_gradient);
    set_action:
      - lambda: |-
          if (!id(sw_write_enable).state) {
            ESP_LOGW("vitodens_can", "Schreiben gesperrt - erst 'Schreiben freigeben' einschalten");
            return;
          }
          vitodens::bus().request_curve(x);
